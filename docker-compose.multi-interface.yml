services:
  dhcp-server:
    command: ["auto"]
    environment:
      DHCPV4_PRIMARY_INTERFACE_ADDRESS: 172.29.0.2
      DHCPV4_SECOND_INTERFACE: auto
      DHCPV4_SECOND_INTERFACE_ADDRESS: 172.30.0.2
      DHCPV4_SECOND_SUBNET: 172.30.0.0/24
      DHCPV4_SECOND_POOL_START: 172.30.0.100
      DHCPV4_SECOND_POOL_END: 172.30.0.120
      DHCPV4_SECOND_ROUTER: 172.30.0.1
    networks:
      dhcp-test-net:
        ipv4_address: 172.29.0.2
      dhcp-secondary-net:
        ipv4_address: 172.30.0.2

  test-runner:
    environment:
      TEST_INTERFACE: auto
      TEST_INTERFACE_ADDRESS: 172.29.0.3
      TEST_SECOND_INTERFACE: auto
      TEST_SECOND_INTERFACE_ADDRESS: 172.30.0.3
      TEST_SECOND_SUBNET: 172.30.0.0/24
      TEST_SECOND_SERVER_IP: 172.30.0.2
      TEST_SECOND_WRONG_SUBNET_HINT: 172.29.0.100
    networks:
      dhcp-test-net:
        ipv4_address: 172.29.0.3
      dhcp-secondary-net:
        ipv4_address: 172.30.0.3

networks:
  dhcp-secondary-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
