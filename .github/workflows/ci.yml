name: DHCP Acceptance Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  test:
    name: Required / ${{ matrix.server }} / ${{ matrix.ip_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: isc-dhcpd
            ip_version: v4
          - server: isc-dhcpd
            ip_version: v6
          - server: kea
            ip_version: v4
          - server: kea
            ip_version: v6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        id: required-tests
        run: bash ./run_dhcp_tests.sh --server ${{ matrix.server }} --ip-version ${{ matrix.ip_version }}

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish test summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Required / ${{ matrix.server }} / ${{ matrix.ip_version }}"
          --run-outcome "${{ steps.required-tests.outcome }}"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-${{ matrix.server }}-${{ matrix.ip_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  pool-exhaustion:
    name: Required / ${{ matrix.server }} / v4 pool exhaustion
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
    env:
      DHCPV4_POOL_START_OFFSET: "190"
      DHCPV4_POOL_END_OFFSET: "193"
      DHCPV4_ALT_POOL_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exhaust and recover the bounded DHCPv4 pool
        id: pool-tests
        run: >-
          bash ./run_dhcp_tests.sh
          --server ${{ matrix.server }}
          --ip-version v4
          --tags @pool_exhaustion

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish pool-exhaustion summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Required / ${{ matrix.server }} / v4 pool exhaustion"
          --run-outcome "${{ steps.pool-tests.outcome }}"

      - name: Upload pool-exhaustion JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-exhaustion-${{ matrix.server }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  rfc8925-zero-default:
    name: RFC 8925 zero-default / ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
    env:
      RFC8925_WAIT: "0"
      TEST_CAPABILITIES: rfc8925_zero_default
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the four-octet zero V6ONLY_WAIT fallback
        id: rfc8925-zero-tests
        run: >-
          bash ./run_dhcp_tests.sh
          --server ${{ matrix.server }}
          --ip-version v4
          --tags @rfc8925_zero_default

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish RFC 8925 zero-default summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "RFC 8925 zero-default / ${{ matrix.server }}"
          --run-outcome "${{ steps.rfc8925-zero-tests.outcome }}"

      - name: Upload RFC 8925 zero-default JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc8925-zero-default-${{ matrix.server }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  focused-robustness:
    name: Focused robustness / ${{ matrix.server }} / v4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
    env:
      TEST_DHCPV4_CONCURRENT_CLIENTS: "24"
      TEST_DHCPV4_BATCH_DEADLINE: "20"
      TEST_DHCPV4_CHURN_CYCLES: "24"
      TEST_DHCPV4_FUZZ_CASES: "32"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run bounded malformed, load, and churn checks
        id: robustness-tests
        run: >-
          bash ./run_dhcp_tests.sh
          --server ${{ matrix.server }}
          --ip-version v4
          --tags @focused_robustness

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish focused-robustness summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Focused robustness / ${{ matrix.server }} / v4"
          --run-outcome "${{ steps.robustness-tests.outcome }}"

      - name: Upload focused-robustness JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-robustness-${{ matrix.server }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  runtime-storage-fault:
    name: Runtime storage fault / ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP baseline
            server: isc-dhcpd
            server_version: baseline
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Exhaust lease storage and verify forced-restart recovery
        id: storage-fault-tests
        run: >-
          bash ./run_storage_fault_tests.sh
          --server ${{ matrix.server }}
          --server-version ${{ matrix.server_version }}

      - name: Tear down storage-fault fixture
        if: always()
        run: |
          docker rm -f dhcp-storage-fault-runner 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.storage-fault.yml down -v

      - name: Publish storage-fault summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Runtime storage fault / ${{ matrix.name }}"
          --run-outcome "${{ steps.storage-fault-tests.outcome }}"

      - name: Upload storage-fault reports, metrics, and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-storage-fault-${{ matrix.server_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  stress-crash-smoke:
    name: Stress crash smoke / ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Crash the server during mixed DHCPv4 load
        id: stress-crash-tests
        run: >-
          bash ./run_stress_crash_tests.sh
          --server ${{ matrix.server }}
          --server-version ${{ matrix.server_version }}
          --profile smoke

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish stress-crash summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Stress crash smoke / ${{ matrix.name }}"
          --run-outcome "${{ steps.stress-crash-tests.outcome }}"

      - name: Upload stress reports and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-crash-smoke-${{ matrix.server_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  stress-crash-scheduled:
    name: Scheduled stress crash / ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run the scheduled mixed-load crash profile
        id: scheduled-stress-tests
        run: >-
          bash ./run_stress_crash_tests.sh
          --server ${{ matrix.server }}
          --server-version ${{ matrix.server_version }}
          --profile scheduled

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish scheduled stress summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Scheduled stress crash / ${{ matrix.name }}"
          --run-outcome "${{ steps.scheduled-stress-tests.outcome }}"

      - name: Upload scheduled stress reports and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-crash-scheduled-${{ matrix.server_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  dhcpv4-soak-scheduled:
    name: Scheduled DHCPv4 soak / ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run lease churn with resource sampling
        id: soak-tests
        run: >-
          bash ./run_soak_tests.sh
          --server ${{ matrix.server }}
          --server-version ${{ matrix.server_version }}
          --profile scheduled

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish soak summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Scheduled DHCPv4 soak / ${{ matrix.name }}"
          --run-outcome "${{ steps.soak-tests.outcome }}"

      - name: Upload soak reports and resource metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhcpv4-soak-${{ matrix.server_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  server-ping-check:
    name: RFC 2131 ping check / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP baseline
            server: isc-dhcpd
            server_version: baseline
          - name: Kea 3.2.0 stable
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe silent and responding candidate addresses
        id: ping-check-tests
        run: >-
          bash ./run_ping_check_tests.sh
          --server ${{ matrix.server }}
          --server-version ${{ matrix.server_version }}

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish server ping-check summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "RFC 2131 ping check / ${{ matrix.name }}"
          --run-outcome "${{ steps.ping-check-tests.outcome }}"

      - name: Upload server ping-check JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-ping-check-${{ matrix.server }}-${{ matrix.server_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  overlapping-subnet-leases:
    name: Overlapping subnet leases / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kea 3.0.3 LTS
            server_version: kea-lts
          - name: Kea 3.2.0 stable
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify lease selection in both subnet declaration orders
        id: overlap-lease-tests
        run: >-
          bash ./run_overlap_lease_tests.sh
          --server kea
          --server-version ${{ matrix.server_version }}

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish overlapping-subnet summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Overlapping subnet leases / ${{ matrix.name }}"
          --run-outcome "${{ steps.overlap-lease-tests.outcome }}"

      - name: Upload overlapping-subnet JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlapping-subnet-leases-${{ matrix.server_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  lifecycle-safety:
    name: Lifecycle and safety / ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: isc-dhcpd
            overlap_policy: reject
          - server: kea
            overlap_policy: allow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify graceful and abrupt restart recovery
        id: lifecycle-tests
        run: bash ./run_lifecycle_tests.sh --server ${{ matrix.server }}

      - name: Verify configuration safety policy
        id: safety-tests
        if: always()
        run: >-
          bash ./run_config_safety_tests.sh
          --server ${{ matrix.server }}
          --overlap-policy ${{ matrix.overlap_policy }}

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish lifecycle summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Lifecycle and safety / ${{ matrix.server }}"
          --run-outcome "${{ steps.lifecycle-tests.outcome }}"

      - name: Upload lifecycle JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-safety-${{ matrix.server }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  profile-validation:
    name: Validate conformance profile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate coverage evidence and test tooling
        run: python3 -m unittest discover -s tests

  compatibility:
    name: Informational / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1 / v4
            server: isc-dhcpd
            server_version: isc-final
            ip_version: v4
            extra_args: ""
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: ISC DHCP 4.4.3-P1 / v6
            server: isc-dhcpd
            server_version: isc-final
            ip_version: v6
            extra_args: ""
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v4
            server: kea
            server_version: kea-lts
            ip_version: v4
            extra_args: ""
            expected_failure_pattern: dhcp_rfc8925_ipv6_only_preferred
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v6
            server: kea
            server_version: kea-lts
            ip_version: v6
            extra_args: "--tags @ipv6 --tags ~@kea3_malformed_relay_isolated"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v6 truncated relay Interface-ID
            server: kea
            server_version: kea-lts
            ip_version: v6
            extra_args: "--tags @kea3_truncated_interface_id"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: truncated-interface-id
          - name: Kea 3.2.0 stable / v4
            server: kea
            server_version: kea-stable
            ip_version: v4
            extra_args: ""
            expected_failure_pattern: dhcp_rfc8925_ipv6_only_preferred
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.2.0 stable / v6
            server: kea
            server_version: kea-stable
            ip_version: v6
            extra_args: "--tags @ipv6 --tags ~@kea3_malformed_relay_isolated"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.2.0 stable / v6 truncated relay Interface-ID
            server: kea
            server_version: kea-stable
            ip_version: v6
            extra_args: "--tags @kea3_truncated_interface_id"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: truncated-interface-id
          - name: Kea baseline / known divergences
            server: kea
            server_version: baseline
            ip_version: v6
            extra_args: "--tags @known_divergence"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: known-divergences
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run informational compatibility tests
        id: compatibility-tests
        continue-on-error: ${{ matrix.expected_failure_pattern != '' }}
        run: |
          set -o pipefail
          bash ./run_dhcp_tests.sh \
            --server ${{ matrix.server }} \
            --server-version ${{ matrix.server_version }} \
            --ip-version ${{ matrix.ip_version }} \
            ${{ matrix.extra_args }} 2>&1 | tee compatibility.log

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish compatibility summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Informational / ${{ matrix.name }}"
          --run-outcome "${{ steps.compatibility-tests.outcome }}"
          ${{ matrix.expected_failure_pattern != '' && format('--expected-failure-pattern {0}', matrix.expected_failure_pattern) || '' }}
          ${{ matrix.expected_log_pattern != '' && format('--log-file compatibility.log --expected-log-pattern {0}', matrix.expected_log_pattern) || '' }}

      - name: Upload compatibility JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.server_version }}-${{ matrix.ip_version }}-${{ matrix.artifact_suffix }}-${{ github.run_attempt }}
          path: |
            test-results
            compatibility.log
          if-no-files-found: warn
          retention-days: 14
