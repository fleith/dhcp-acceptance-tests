name: DHCP Acceptance Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  test:
    name: Required / ${{ matrix.server }} / ${{ matrix.ip_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: isc-dhcpd
            ip_version: v4
          - server: isc-dhcpd
            ip_version: v6
          - server: kea
            ip_version: v4
          - server: kea
            ip_version: v6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        id: required-tests
        run: bash ./run_dhcp_tests.sh --server ${{ matrix.server }} --ip-version ${{ matrix.ip_version }}

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish test summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Required / ${{ matrix.server }} / ${{ matrix.ip_version }}"
          --run-outcome "${{ steps.required-tests.outcome }}"

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-${{ matrix.server }}-${{ matrix.ip_version }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Informational / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1 / v4
            server: isc-dhcpd
            server_version: isc-final
            ip_version: v4
            extra_args: ""
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: ISC DHCP 4.4.3-P1 / v6
            server: isc-dhcpd
            server_version: isc-final
            ip_version: v6
            extra_args: ""
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v4
            server: kea
            server_version: kea-lts
            ip_version: v4
            extra_args: ""
            expected_failure_pattern: dhcp_rfc8925_ipv6_only_preferred
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v6
            server: kea
            server_version: kea-lts
            ip_version: v6
            extra_args: "--tags @ipv6 --tags ~@kea3_malformed_relay_crash"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v6 malformed relay robustness
            server: kea
            server_version: kea-lts
            ip_version: v6
            extra_args: "--tags @kea3_malformed_relay_crash"
            expected_failure_pattern: dhcpv6_relay
            expected_log_pattern: stl_vector.h
            artifact_suffix: malformed-relay
          - name: Kea 3.2.0 stable / v4
            server: kea
            server_version: kea-stable
            ip_version: v4
            extra_args: ""
            expected_failure_pattern: dhcp_rfc8925_ipv6_only_preferred
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.2.0 stable / v6
            server: kea
            server_version: kea-stable
            ip_version: v6
            extra_args: "--tags @ipv6 --tags ~@kea3_malformed_relay_crash"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: full
          - name: Kea 3.2.0 stable / v6 malformed relay robustness
            server: kea
            server_version: kea-stable
            ip_version: v6
            extra_args: "--tags @kea3_malformed_relay_crash"
            expected_failure_pattern: dhcpv6_relay
            expected_log_pattern: stl_vector.h
            artifact_suffix: malformed-relay
          - name: Kea baseline / known divergences
            server: kea
            server_version: baseline
            ip_version: v6
            extra_args: "--tags @known_divergence"
            expected_failure_pattern: ""
            expected_log_pattern: ""
            artifact_suffix: known-divergences
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run informational compatibility tests
        id: compatibility-tests
        continue-on-error: ${{ matrix.expected_failure_pattern != '' }}
        run: |
          set -o pipefail
          bash ./run_dhcp_tests.sh \
            --server ${{ matrix.server }} \
            --server-version ${{ matrix.server_version }} \
            --ip-version ${{ matrix.ip_version }} \
            ${{ matrix.extra_args }} 2>&1 | tee compatibility.log

      - name: Tear down containers
        if: always()
        run: docker compose down

      - name: Publish compatibility summary
        if: always()
        run: >-
          python3 summarize_junit.py
          --results test-results
          --title "Informational / ${{ matrix.name }}"
          --run-outcome "${{ steps.compatibility-tests.outcome }}"
          ${{ matrix.expected_failure_pattern != '' && format('--expected-failure-pattern {0}', matrix.expected_failure_pattern) || '' }}
          ${{ matrix.expected_log_pattern != '' && format('--log-file compatibility.log --expected-log-pattern {0}', matrix.expected_log_pattern) || '' }}

      - name: Upload compatibility JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.server_version }}-${{ matrix.ip_version }}-${{ matrix.artifact_suffix }}-${{ github.run_attempt }}
          path: |
            test-results
            compatibility.log
          if-no-files-found: warn
          retention-days: 14
