name: DHCP Acceptance Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  test:
    name: Required / ${{ matrix.server }} / ${{ matrix.ip_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: isc-dhcpd
            ip_version: v4
          - server: isc-dhcpd
            ip_version: v6
          - server: kea
            ip_version: v4
          - server: kea
            ip_version: v6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_dhcp_tests.sh --server ${{ matrix.server }} --ip-version ${{ matrix.ip_version }}
          title: Required / ${{ matrix.server }} / ${{ matrix.ip_version }}
          artifact-name: required-${{ matrix.server }}-${{ matrix.ip_version }}-${{ github.run_attempt }}

  pool-exhaustion:
    name: Required / ${{ matrix.server }} / v4 pool exhaustion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
    env:
      DHCPV4_POOL_START_OFFSET: "190"
      DHCPV4_POOL_END_OFFSET: "193"
      DHCPV4_ALT_POOL_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_dhcp_tests.sh --server ${{ matrix.server }} --ip-version v4 --tags @pool_exhaustion
          title: Required / ${{ matrix.server }} / v4 pool exhaustion
          artifact-name: pool-exhaustion-${{ matrix.server }}-${{ github.run_attempt }}

  rfc8925-zero-default:
    name: RFC 8925 zero-default / ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
    env:
      RFC8925_WAIT: "0"
      TEST_CAPABILITIES: rfc8925_zero_default
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_dhcp_tests.sh --server ${{ matrix.server }} --ip-version v4 --tags @rfc8925_zero_default
          title: RFC 8925 zero-default / ${{ matrix.server }}
          artifact-name: rfc8925-zero-default-${{ matrix.server }}-${{ github.run_attempt }}

  ipv4-observability:
    name: IPv4 observability / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_ipv4_observability_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }}
          title: IPv4 observability / ${{ matrix.name }}
          artifact-name: ipv4-observability-${{ matrix.server_version }}-${{ github.run_attempt }}
          artifact-path: |-
            test-results
            test-state/dhcpv4-server.log

  dhcpv6-rfc4704:
    name: DHCPv6 RFC 4704 / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kea 3.0.3 LTS
            server_version: kea-lts
          - name: Kea 3.2.0 stable
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_dhcpv6_rfc4704_tests.sh --server-version ${{ matrix.server_version }}
          title: DHCPv6 RFC 4704 / ${{ matrix.name }}
          artifact-name: dhcpv6-rfc4704-${{ matrix.server_version }}-${{ github.run_attempt }}

  dhcpv6-interface-id-policy:
    name: DHCPv6 Interface-ID policy / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kea 3.0.3 LTS
            server_version: kea-lts
          - name: Kea 3.2.0 stable
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_dhcpv6_interface_id_tests.sh --server-version ${{ matrix.server_version }}
          title: DHCPv6 Interface-ID policy / ${{ matrix.name }}
          artifact-name: dhcpv6-interface-id-${{ matrix.server_version }}-${{ github.run_attempt }}

  dhcpv6-reserved-iid-pools:
    name: DHCPv6 focused RFC 9915 / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kea 3.0.3 LTS
            server_version: kea-lts
          - name: Kea 3.2.0 stable
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: |-
            bash ./run_dhcpv6_reserved_iid_tests.sh \
              --server-version ${{ matrix.server_version }}
            bash ./run_dhcpv6_request_regeneration_tests.sh \
              --server-version ${{ matrix.server_version }}
            bash ./run_dhcpv6_rebind_ownership_tests.sh \
              --server-version ${{ matrix.server_version }}
          title: DHCPv6 focused RFC 9915 / ${{ matrix.name }}
          artifact-name: dhcpv6-focused-rfc9915-${{ matrix.server_version }}-${{ github.run_attempt }}

  ipv4-operational-capabilities:
    name: IPv4 operational capabilities / Kea 3.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: |-
            bash ./run_offer_hold_boundary_tests.sh
            bash ./run_reload_tests.sh
            bash ./run_multi_interface_tests.sh
            bash ./run_ha_tests.sh
          title: IPv4 operational capabilities / Kea 3.2.0
          artifact-name: ipv4-operational-capabilities-${{ github.run_attempt }}

  focused-robustness:
    name: Focused robustness / ${{ matrix.server }} / ${{ matrix.ip_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
        ip_version: [v4, v6]
    env:
      TEST_DHCPV4_CONCURRENT_CLIENTS: "24"
      TEST_DHCPV4_BATCH_DEADLINE: "20"
      TEST_DHCPV4_CHURN_CYCLES: "24"
      TEST_DHCPV4_FUZZ_CASES: "40"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_dhcp_tests.sh --server ${{ matrix.server }} --ip-version ${{ matrix.ip_version }} --tags @focused_robustness
          title: Focused robustness / ${{ matrix.server }} / ${{ matrix.ip_version }}
          artifact-name: focused-robustness-${{ matrix.server }}-${{ matrix.ip_version }}-${{ github.run_attempt }}

  dhcpv6-server-policy:
    name: DHCPv6 server policy / ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [isc-dhcpd, kea]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: |-
            rc=0
            bash ./run_dhcpv6_preference_tests.sh --server ${{ matrix.server }} || rc=$?
            bash ./run_dhcpv6_rebind_policy_tests.sh --server ${{ matrix.server }} || rc=$?
            exit $rc
          title: DHCPv6 server policy / ${{ matrix.server }}
          artifact-name: dhcpv6-server-policy-${{ matrix.server }}-${{ github.run_attempt }}

  runtime-storage-fault:
    name: Runtime storage fault / ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP baseline
            server: isc-dhcpd
            server_version: baseline
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_storage_fault_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }}
          title: Runtime storage fault / ${{ matrix.name }}
          artifact-name: runtime-storage-fault-${{ matrix.server_version }}-${{ github.run_attempt }}

  stress-crash-smoke:
    name: Stress crash smoke / ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_stress_crash_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }} --profile smoke
          title: Stress crash smoke / ${{ matrix.name }}
          artifact-name: stress-crash-smoke-${{ matrix.server_version }}-${{ github.run_attempt }}

  stress-crash-scheduled:
    name: Scheduled stress crash / ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_stress_crash_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }} --profile scheduled
          title: Scheduled stress crash / ${{ matrix.name }}
          artifact-name: stress-crash-scheduled-${{ matrix.server_version }}-${{ github.run_attempt }}

  dhcpv4-soak-scheduled:
    name: Scheduled DHCPv4 soak / ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_soak_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }} --profile scheduled
          title: Scheduled DHCPv4 soak / ${{ matrix.name }}
          artifact-name: dhcpv4-soak-${{ matrix.server_version }}-${{ github.run_attempt }}

  dhcpv4-capacity-smoke:
    name: Large-pool capacity smoke / ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_capacity_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }} --profile smoke
          title: Large-pool capacity smoke / ${{ matrix.name }}
          artifact-name: dhcpv4-capacity-smoke-${{ matrix.server_version }}-${{ github.run_attempt }}

  dhcpv4-capacity-scheduled:
    name: Scheduled large-pool capacity / ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_capacity_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }} --profile scheduled
          title: Scheduled large-pool capacity / ${{ matrix.name }}
          artifact-name: dhcpv4-capacity-scheduled-${{ matrix.server_version }}-${{ github.run_attempt }}

  dhcpv4-capacity-endurance:
    name: Manual capacity endurance / ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1
            server: isc-dhcpd
            server_version: isc-final
          - name: Kea 3.2.0
            server: kea
            server_version: kea-stable
    env:
      TEST_DHCPV4_CAPACITY_DURATION_SECONDS: ${{ vars.DHCP_CAPACITY_ENDURANCE_SECONDS || '3600' }}
      TEST_DHCPV4_CAPACITY_MIN_ENDURANCE_COMMITS: ${{ vars.DHCP_CAPACITY_ENDURANCE_MIN_COMMITS || '1024' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_capacity_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }} --profile endurance
          title: Manual capacity endurance / ${{ matrix.name }}
          artifact-name: dhcpv4-capacity-endurance-${{ matrix.server_version }}-${{ github.run_attempt }}

  server-ping-check:
    name: RFC 2131 ping check / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ISC DHCP baseline
            server: isc-dhcpd
            server_version: baseline
          - name: Kea 3.2.0 stable
            server: kea
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_ping_check_tests.sh --server ${{ matrix.server }} --server-version ${{ matrix.server_version }}
          title: RFC 2131 ping check / ${{ matrix.name }}
          artifact-name: server-ping-check-${{ matrix.server }}-${{ matrix.server_version }}-${{ github.run_attempt }}

  overlapping-subnet-leases:
    name: Overlapping subnet leases / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kea 3.0.3 LTS
            server_version: kea-lts
          - name: Kea 3.2.0 stable
            server_version: kea-stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: bash ./run_overlap_lease_tests.sh --server kea --server-version ${{ matrix.server_version }}
          title: Overlapping subnet leases / ${{ matrix.name }}
          artifact-name: overlapping-subnet-leases-${{ matrix.server_version }}-${{ github.run_attempt }}

  lifecycle-safety:
    name: Lifecycle and safety / ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: isc-dhcpd
            overlap_policy: reject
          - server: kea
            overlap_policy: allow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: |-
            rc=0
            bash ./run_lifecycle_tests.sh --server ${{ matrix.server }} || rc=$?
            bash ./run_config_safety_tests.sh --server ${{ matrix.server }} --overlap-policy ${{ matrix.overlap_policy }} || rc=$?
            exit $rc
          title: Lifecycle and safety / ${{ matrix.server }}
          artifact-name: lifecycle-safety-${{ matrix.server }}-${{ github.run_attempt }}

  profile-validation:
    name: Validate conformance profile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate coverage evidence and test tooling
        run: python3 -m unittest discover -s tests

  compatibility:
    name: Informational / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ISC DHCP 4.4.3-P1 / v4
            server: isc-dhcpd
            server_version: isc-final
            ip_version: v4
            extra_args: ''
            expected_failure: ''
            artifact_suffix: full
          - name: ISC DHCP 4.4.3-P1 / v6
            server: isc-dhcpd
            server_version: isc-final
            ip_version: v6
            extra_args: ''
            expected_failure: ''
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v4
            server: kea
            server_version: kea-lts
            ip_version: v4
            extra_args: ''
            expected_failure: Server returns configured classless routes in OFFER and ACK
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v6
            server: kea
            server_version: kea-lts
            ip_version: v6
            extra_args: --tags @ipv6 --tags ~@kea3_malformed_relay_isolated
            expected_failure: ''
            artifact_suffix: full
          - name: Kea 3.0.3 LTS / v6 truncated relay Interface-ID
            server: kea
            server_version: kea-lts
            ip_version: v6
            extra_args: --tags @kea3_truncated_interface_id
            expected_failure: ''
            artifact_suffix: truncated-interface-id
          - name: Kea 3.2.0 stable / v4
            server: kea
            server_version: kea-stable
            ip_version: v4
            extra_args: ''
            expected_failure: Server returns configured classless routes in OFFER and ACK
            artifact_suffix: full
          - name: Kea 3.2.0 stable / v6
            server: kea
            server_version: kea-stable
            ip_version: v6
            extra_args: --tags @ipv6 --tags ~@kea3_malformed_relay_isolated
            expected_failure: ''
            artifact_suffix: full
          - name: Kea 3.2.0 stable / v6 truncated relay Interface-ID
            server: kea
            server_version: kea-stable
            ip_version: v6
            extra_args: --tags @kea3_truncated_interface_id
            expected_failure: ''
            artifact_suffix: truncated-interface-id
          - name: Kea baseline / IPv4 known divergences
            server: kea
            server_version: baseline
            ip_version: v4
            extra_args: --tags @known_divergence --tags @ipv4
            expected_failure: ''
            artifact_suffix: known-divergences
          - name: Kea baseline / IPv6 known divergences
            server: kea
            server_version: baseline
            ip_version: v6
            extra_args: --tags @known_divergence --tags @ipv6
            expected_failure: ''
            artifact_suffix: known-divergences
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/dhcp-suite
        with:
          command: |-
            set -o pipefail
            bash ./run_dhcp_tests.sh \
              --server ${{ matrix.server }} \
              --server-version ${{ matrix.server_version }} \
              --ip-version ${{ matrix.ip_version }} \
              ${{ matrix.extra_args }} 2>&1 | tee compatibility.log
          title: Informational / ${{ matrix.name }}
          artifact-name: compatibility-${{ matrix.server_version }}-${{ matrix.ip_version }}-${{ matrix.artifact_suffix }}-${{ github.run_attempt }}
          artifact-path: |-
            test-results
            compatibility.log
          expected-failure: ${{ matrix.expected_failure }}
