services:
  dhcp-server:
    image: dhcp-test-server-kea:local
    build:
      context: ./kea
      args:
        KEA_BASE_IMAGE: ${KEA_BASE_IMAGE:-debian:bookworm-slim}
        KEA_INSTALL_MODE: ${KEA_INSTALL_MODE:-debian}
    command: ["eth0"]
    healthcheck:
      test: ["CMD-SHELL", "ss -ulpn | grep -q ':67'"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  test-runner:
    environment:
      TEST_SERVER_IMPL: kea
