services:
  dhcp-server:
    entrypoint: ["/storage-fault-entrypoint.sh"]
    environment:
      DHCPV4_STORAGE_TARGET: ${DHCPV4_STORAGE_TARGET:-/data}
    volumes:
      - storage-fault-backing:/storage-fault-backing

  test-runner:
    command: ["tail", "-f", "/dev/null"]

volumes:
  storage-fault-backing:
