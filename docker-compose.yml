services:
  dhcp-server:
    build:
      context: ./dhcp
      args:
        ISC_DHCP_BASE_IMAGE: ${ISC_DHCP_BASE_IMAGE:-networkboot/dhcpd:1.3.0}
    container_name: dhcp-test-server
    command: ["eth0"]
    environment:
      RFC3011_ALT_SUBNET: 172.29.1.0/24
      RFC3011_ALT_SERVER_IP: 172.29.1.2
      DHCPV4_RELAY_SUBNET: 172.29.2.0/24
      RFC8925_WAIT: ${RFC8925_WAIT:-1800}
      RFC3442_EXTRA_ROUTE_COUNT: ${RFC3442_EXTRA_ROUTE_COUNT:-30}
      DHCPV4_RFC3396_POLICY_DOMAIN: ${DHCPV4_RFC3396_POLICY_DOMAIN:-rfc3396-reassembled.test}
      DHCPV4_POOL_START_OFFSET: ${DHCPV4_POOL_START_OFFSET:-100}
      DHCPV4_POOL_END_OFFSET: ${DHCPV4_POOL_END_OFFSET:-200}
      DHCPV4_ALT_POOL_ENABLED: ${DHCPV4_ALT_POOL_ENABLED:-1}
      DHCPV4_RESERVED_MAC: ${DHCPV4_RESERVED_MAC:-02:00:00:ff:00:01}
      DHCPV4_RESERVED_OFFSET: ${DHCPV4_RESERVED_OFFSET:-50}
      DHCPV4_CLASS_NAME: ${DHCPV4_CLASS_NAME:-acceptance-class}
      DHCPV4_RELAY_POLICY_CIRCUIT: ${DHCPV4_RELAY_POLICY_CIRCUIT:-slot=01/port=007}
      DHCPV4_RELAY_POLICY_DOMAIN: ${DHCPV4_RELAY_POLICY_DOMAIN:-opaque-circuit.acceptance.test}
      DHCPV4_INJECT_OVERLAPPING_SUBNET: ${DHCPV4_INJECT_OVERLAPPING_SUBNET:-0}
      DHCPV4_OVERLAP_ORDER: ${DHCPV4_OVERLAP_ORDER:-primary-first}
      DHCPV4_FORCE_STORAGE_FAILURE: ${DHCPV4_FORCE_STORAGE_FAILURE:-0}
      DHCPV4_PING_CHECK_ENABLED: ${DHCPV4_PING_CHECK_ENABLED:-0}
      DHCPV4_PING_TIMEOUT: ${DHCPV4_PING_TIMEOUT:-1}
      DHCPV4_PING_TIMEOUT_MS: ${DHCPV4_PING_TIMEOUT_MS:-300}
      DHCPV4_PING_CHECK_ADDRESS: ${TEST_DHCPV4_PING_CHECK_ADDRESS:-}
      DHCPV4_PING_CHECK_PEER_MAC: ${DHCPV4_PING_CHECK_PEER_MAC:-02:42:ac:1d:00:03}
    cap_add:
      - NET_ADMIN
    privileged: true
    networks:
      dhcp-test-net:
        ipv4_address: 172.29.0.2
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/dhcpd.pid && ss -ulpn | grep -q ':67'"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  test-runner:
    image: python:3.13-slim
    container_name: dhcp-test-runner
    privileged: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    mac_address: "02:42:ac:1d:00:03"
    networks:
      dhcp-test-net:
        ipv4_address: 172.29.0.3
    environment:
      TEST_SERVER_IP: 172.29.0.2
      TEST_SERVER_IMPL: isc-dhcpd
      TEST_INTERFACE: eth0
      TEST_SUBNET_SELECTION_SUBNET: 172.29.1.0/24
      TEST_DHCPV4_RELAY_SUBNET: 172.29.2.0/24
      TEST_RFC3442_GATEWAY: 172.29.0.254
      TEST_RFC3442_DEFAULT_ROUTE: 0.0.0.0/0=172.29.0.254
      TEST_RFC3442_NON_OCTET_ROUTE: 198.51.100.128/25=172.29.0.254
      TEST_RFC3442_ADDITIONAL_ROUTES: 203.0.113.0/24=172.29.0.254
      TEST_RFC3442_EXTRA_ROUTE_COUNT: ${RFC3442_EXTRA_ROUTE_COUNT:-30}
      TEST_RFC3396_POLICY_DOMAIN: ${DHCPV4_RFC3396_POLICY_DOMAIN:-rfc3396-reassembled.test}
      TEST_RFC8925_WAIT: ${RFC8925_WAIT:-1800}
      TEST_RFC8925_ALT_SERVER_IP: 172.29.0.2
      DHCPV4_POOL_START_OFFSET: ${DHCPV4_POOL_START_OFFSET:-100}
      DHCPV4_POOL_END_OFFSET: ${DHCPV4_POOL_END_OFFSET:-200}
      DHCPV4_ALT_POOL_ENABLED: ${DHCPV4_ALT_POOL_ENABLED:-1}
      TEST_DHCPV4_EXHAUSTION_LIMIT: ${TEST_DHCPV4_EXHAUSTION_LIMIT:-16}
      TEST_DHCPV4_RESERVED_MAC: ${DHCPV4_RESERVED_MAC:-02:00:00:ff:00:01}
      TEST_DHCPV4_RESERVED_OFFSET: ${DHCPV4_RESERVED_OFFSET:-50}
      TEST_DHCPV4_CLASS_NAME: ${DHCPV4_CLASS_NAME:-acceptance-class}
      TEST_DHCPV4_CLASS_DOMAIN: ${DHCPV4_CLASS_DOMAIN:-class.acceptance.test}
      TEST_DHCPV4_RELAY_POLICY_CIRCUIT: ${DHCPV4_RELAY_POLICY_CIRCUIT:-slot=01/port=007}
      TEST_DHCPV4_RELAY_POLICY_DOMAIN: ${DHCPV4_RELAY_POLICY_DOMAIN:-opaque-circuit.acceptance.test}
      TEST_DHCPV4_CONCURRENT_CLIENTS: ${TEST_DHCPV4_CONCURRENT_CLIENTS:-8}
      TEST_DHCPV4_BATCH_DEADLINE: ${TEST_DHCPV4_BATCH_DEADLINE:-15}
      TEST_DHCPV4_CHURN_CYCLES: ${TEST_DHCPV4_CHURN_CYCLES:-12}
      TEST_DHCPV4_FUZZ_CASES: ${TEST_DHCPV4_FUZZ_CASES:-24}
      TEST_DHCPV4_PING_CHECK_ADDRESS: ${TEST_DHCPV4_PING_CHECK_ADDRESS:-}
      TEST_DHCPV4_OVERLAP_EXPECTED_POOL_START: ${TEST_DHCPV4_OVERLAP_EXPECTED_POOL_START:-}
      TEST_DHCPV4_OVERLAP_EXPECTED_POOL_END: ${TEST_DHCPV4_OVERLAP_EXPECTED_POOL_END:-}
      TEST_DHCPV4_OVERLAP_LOSING_HINT: ${TEST_DHCPV4_OVERLAP_LOSING_HINT:-}
      TEST_DHCPV4_OVERLAP_EXPECTED_DOMAIN: ${TEST_DHCPV4_OVERLAP_EXPECTED_DOMAIN:-}
      TEST_DHCPV4_OVERLAP_EXPECTED_SCOPE: ${TEST_DHCPV4_OVERLAP_EXPECTED_SCOPE:-}
      TEST_DHCPV4_STRESS_PREPARE_CLIENTS: ${TEST_DHCPV4_STRESS_PREPARE_CLIENTS:-32}
      TEST_DHCPV4_STRESS_INFLIGHT_CLIENTS: ${TEST_DHCPV4_STRESS_INFLIGHT_CLIENTS:-24}
      TEST_DHCPV4_STRESS_POST_CLIENTS: ${TEST_DHCPV4_STRESS_POST_CLIENTS:-8}
      TEST_DHCPV4_STRESS_CHURN_ROUNDS: ${TEST_DHCPV4_STRESS_CHURN_ROUNDS:-2}
      TEST_DHCPV4_STRESS_CHURN_BATCH: ${TEST_DHCPV4_STRESS_CHURN_BATCH:-8}
      TEST_DHCPV4_STRESS_CRASH_LOAD_SECONDS: ${TEST_DHCPV4_STRESS_CRASH_LOAD_SECONDS:-3}
      TEST_DHCPV4_STRESS_CAPTURE_TIMEOUT: ${TEST_DHCPV4_STRESS_CAPTURE_TIMEOUT:-10}
      TEST_DHCPV4_STRESS_BATCH_DEADLINE: ${TEST_DHCPV4_STRESS_BATCH_DEADLINE:-20}
      TEST_DHCPV4_STRESS_P95_LIMIT_MS: ${TEST_DHCPV4_STRESS_P95_LIMIT_MS:-3000}
      TEST_DHCPV4_STRESS_POOL_CAPACITY: ${TEST_DHCPV4_STRESS_POOL_CAPACITY:-101}
      TEST_DHCPV4_SOAK_ROUNDS: ${TEST_DHCPV4_SOAK_ROUNDS:-8}
      TEST_DHCPV4_SOAK_BATCH_SIZE: ${TEST_DHCPV4_SOAK_BATCH_SIZE:-16}
      TEST_DHCPV4_SOAK_POST_BATCH_SIZE: ${TEST_DHCPV4_SOAK_POST_BATCH_SIZE:-8}
      TEST_DHCPV4_SOAK_POOL_CAPACITY: ${TEST_DHCPV4_SOAK_POOL_CAPACITY:-101}
      TEST_DHCPV4_SOAK_RELEASE_SETTLE_SECONDS: ${TEST_DHCPV4_SOAK_RELEASE_SETTLE_SECONDS:-0.2}
      TEST_DHCPV4_SOAK_CAPTURE_TIMEOUT: ${TEST_DHCPV4_SOAK_CAPTURE_TIMEOUT:-10}
      TEST_DHCPV4_SOAK_BATCH_DEADLINE: ${TEST_DHCPV4_SOAK_BATCH_DEADLINE:-20}
      TEST_DHCPV4_SOAK_P95_LIMIT_MS: ${TEST_DHCPV4_SOAK_P95_LIMIT_MS:-3000}
      TEST_DHCPV4_SOAK_LATENCY_GROWTH_LIMIT_MS: ${TEST_DHCPV4_SOAK_LATENCY_GROWTH_LIMIT_MS:-500}
      TEST_DHCPV4_SOAK_MEMORY_GROWTH_LIMIT_MIB: ${TEST_DHCPV4_SOAK_MEMORY_GROWTH_LIMIT_MIB:-64}
      TEST_DHCPV4_SOAK_PIDS_GROWTH_LIMIT: ${TEST_DHCPV4_SOAK_PIDS_GROWTH_LIMIT:-8}
      TEST_DHCPV4_STORAGE_BASELINE_CLIENTS: ${TEST_DHCPV4_STORAGE_BASELINE_CLIENTS:-10}
      TEST_DHCPV4_STORAGE_POOL_CAPACITY: ${TEST_DHCPV4_STORAGE_POOL_CAPACITY:-11}
      TEST_DHCPV4_STORAGE_FAULT_TIMEOUT: ${TEST_DHCPV4_STORAGE_FAULT_TIMEOUT:-4}
      TEST_DHCPV4_STORAGE_RECOVERY_TIMEOUT: ${TEST_DHCPV4_STORAGE_RECOVERY_TIMEOUT:-10}
      TEST_STATE_DIR: ${TEST_STATE_DIR:-/app/test-state}
      TEST_CAPABILITIES: ${TEST_CAPABILITIES:-}
      TEST_RELOAD_COMMAND: ${TEST_RELOAD_COMMAND:-}
      TEST_RELOADED_CLASS_DOMAIN: ${TEST_RELOADED_CLASS_DOMAIN:-reloaded.acceptance.test}
      TEST_HA_FAILOVER_COMMAND: ${TEST_HA_FAILOVER_COMMAND:-}
      TEST_HA_RECOVER_COMMAND: ${TEST_HA_RECOVER_COMMAND:-}
      TEST_DNS_SERVER: ${TEST_DNS_SERVER:-}
      TEST_DDNS_FQDN: ${TEST_DDNS_FQDN:-acceptance-client.dhcp-acceptance.test.}
      TEST_SECOND_INTERFACE: ${TEST_SECOND_INTERFACE:-}
      TEST_SECOND_SUBNET: ${TEST_SECOND_SUBNET:-}
      TEST_SECOND_SERVER_IP: ${TEST_SECOND_SERVER_IP:-}
      TEST_RECONFIGURE_TRIGGER_COMMAND: ${TEST_RECONFIGURE_TRIGGER_COMMAND:-}
      TEST_RECONFIGURE_AUTH_VALIDATOR_COMMAND: ${TEST_RECONFIGURE_AUTH_VALIDATOR_COMMAND:-}
      TEST_STORAGE_FAIL_COMMAND: ${TEST_STORAGE_FAIL_COMMAND:-}
      TEST_STORAGE_RECOVER_COMMAND: ${TEST_STORAGE_RECOVER_COMMAND:-}
      TEST_REQUIRE_EXECUTED_SCENARIOS: ${TEST_REQUIRE_EXECUTED_SCENARIOS:-0}
      TEST_BEHAVE_ARGS: ${TEST_BEHAVE_ARGS:-}
      TEST_RESULTS_DIR: ${TEST_RESULTS_DIR:-/app/test-results/default}
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "apt-get update -qq &&
               apt-get install -y --no-install-recommends iproute2 -qq &&
               pip install -r requirements.txt -q &&
               python3 run_tests.py"
    depends_on:
      dhcp-server:
        condition: service_healthy

networks:
  dhcp-test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
