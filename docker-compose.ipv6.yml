services:
  dhcp-server:
    entrypoint: ["/entrypoint_v6.sh"]
    command: ["eth0"]
    environment:
      DHCPV6_SUBNET: fd00:29::/64
      DHCPV6_RANGE_START: fd00:29::100
      DHCPV6_RANGE_END: fd00:29::1ff
      DHCPV6_POOL: fd00:29::100 - fd00:29::1ff
      DHCPV6_POOLS_JSON: ${DHCPV6_POOLS_JSON:-}
      DHCPV6_DNS: 2001:4860:4860::8888
      DHCPV6_DOMAIN_SEARCH: example.test
      DHCPV6_PD_PREFIX: "fd00:30::"
      DHCPV6_PD_PREFIX_LEN: 60
      DHCPV6_PD_RANGE_START: "fd00:30::"
      DHCPV6_PD_RANGE_END: "fd00:30:0:f::"
      DHCPV6_PD_DELEGATED_LEN: 64
      DHCPV6_PREFERENCE: ${DHCPV6_PREFERENCE:-}
      DHCPV6_RAPID_COMMIT: ${DHCPV6_RAPID_COMMIT:-1}
      DHCPV6_DDNS_MANAGER_IP: ${DHCPV6_DDNS_MANAGER_IP:-127.0.0.1}
      DHCPV6_DDNS_MANAGER_PORT: ${DHCPV6_DDNS_MANAGER_PORT:-53001}
      DHCPV6_DDNS_SUFFIX: ${DHCPV6_DDNS_SUFFIX:-dhcp-acceptance.test}
      DHCPV6_RENEW_TIMER: ${DHCPV6_RENEW_TIMER:-60}
      DHCPV6_REBIND_TIMER: ${DHCPV6_REBIND_TIMER:-105}
      DHCPV6_PREFERRED_LIFETIME: ${DHCPV6_PREFERRED_LIFETIME:-120}
      DHCPV6_VALID_LIFETIME: ${DHCPV6_VALID_LIFETIME:-120}
      DHCPV6_RECLAIM_TIMER_WAIT: ${DHCPV6_RECLAIM_TIMER_WAIT:-10}
    networks:
      dhcp-test-net:
        ipv6_address: fd00:29::2
    healthcheck:
      test: ["CMD-SHELL", "ss -H -ulnp | grep -q ':547'"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  test-runner:
    networks:
      dhcp-test-net:
        ipv6_address: fd00:29::3
    environment:
      TEST_IP_VERSION: v6
      TEST_SERVER_IPV6: fd00:29::2
      TEST_INTERFACE: eth0
      TEST_RFC4704_SERVER_SUFFIX: dhcp-acceptance.test
      TEST_RFC4704_FQDN: rfc4704-client.dhcp-acceptance.test.
      TEST_RFC4704_EXPECTED_FQDN: rfc4704-client.dhcp-acceptance.test.
      TEST_RFC4704_EXPECTED_PARTIAL_FQDN: rfc4704-partial.dhcp-acceptance.test.
      TEST_RFC4704_DDNS_ABSENCE_WINDOW: ${TEST_RFC4704_DDNS_ABSENCE_WINDOW:-3}
      TEST_RFC4704_DDNS_UPDATE_TIMEOUT: ${TEST_RFC4704_DDNS_UPDATE_TIMEOUT:-15}
      TEST_RFC4704_DDNS_EXPIRY_TIMEOUT: ${TEST_RFC4704_DDNS_EXPIRY_TIMEOUT:-30}
      TEST_DHCPV6_PD_POOL: fd00:30::/60
      TEST_DHCPV6_PD_PREFIX_LEN: 64
      TEST_DHCPV6_PD_HINT_PREFIX_LEN: 64
      TEST_DHCPV6_PD_POOL_CAPACITY: 16
      TEST_CAPABILITIES: ${TEST_CAPABILITIES-dhcpv6_rapid_commit}
      TEST_DHCPV6_EXPECTED_PREFERENCE: ${TEST_DHCPV6_EXPECTED_PREFERENCE:-0}
      TEST_DHCPV6_RESERVED_POOL_ALLOWED: ${TEST_DHCPV6_RESERVED_POOL_ALLOWED:-}
      TEST_DHCPV6_RESERVED_POOL_FORBIDDEN: ${TEST_DHCPV6_RESERVED_POOL_FORBIDDEN:-}

networks:
  dhcp-test-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
        - subnet: fd00:29::/64
