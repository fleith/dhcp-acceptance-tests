services:
  ddns-observer:
    image: python:3.13-slim
    command: >-
      bash -c "pip install -r /app/requirements.txt -q &&
               python3 /app/ddns/observer.py"
    environment:
      DDNS_ZONE: ${DHCPV6_DDNS_SUFFIX:-dhcp-acceptance.test}
    volumes:
      - .:/app:ro
    networks:
      dhcp-test-net:
        ipv4_address: 172.29.0.4
        ipv6_address: fd00:29::4
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(1); s.sendto(b'\x00\x00\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x01\x00\x01', ('127.0.0.1', 53)); s.recvfrom(512)"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  kea-ddns:
    image: ${KEA_DDNS_IMAGE:-docker.cloudsmith.io/isc/docker/kea-dhcp-ddns:3.2.0}
    user: root
    entrypoint: ["/entrypoint_ddns.sh"]
    environment:
      DHCPV6_DDNS_LISTEN_IP: 0.0.0.0
      DHCPV6_DDNS_MANAGER_PORT: 53001
      DHCPV6_DDNS_SERVER_IP: 172.29.0.4
      DHCPV6_DDNS_SERVER_PORT: 53
      DHCPV6_DDNS_SUFFIX: ${DHCPV6_DDNS_SUFFIX:-dhcp-acceptance.test}
    volumes:
      - ./kea/entrypoint_ddns.sh:/entrypoint_ddns.sh:ro
    networks:
      dhcp-test-net:
        ipv4_address: 172.29.0.5
        ipv6_address: fd00:29::5
    depends_on:
      ddns-observer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - kea-dhcp-ddns -t /etc/kea/kea-dhcp-ddns.conf >/dev/null 2>&1
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  dhcp-server:
    environment:
      DHCPV6_DDNS_MANAGER_IP: 172.29.0.5
      DHCPV6_DDNS_MANAGER_PORT: 53001
      DHCPV6_DDNS_SUFFIX: ${DHCPV6_DDNS_SUFFIX:-dhcp-acceptance.test}
      DHCPV6_RENEW_TIMER: 4
      DHCPV6_REBIND_TIMER: 7
      DHCPV6_PREFERRED_LIFETIME: 8
      DHCPV6_VALID_LIFETIME: 12
      DHCPV6_RECLAIM_TIMER_WAIT: 2
    depends_on:
      kea-ddns:
        condition: service_healthy

  test-runner:
    environment:
      TEST_CAPABILITIES: ${TEST_CAPABILITIES:-dhcpv6_rapid_commit,dhcpv6_ddns}
      TEST_DNS_SERVER: 172.29.0.4
      TEST_RFC4704_DDNS_ABSENCE_WINDOW: 3
      TEST_RFC4704_DDNS_UPDATE_TIMEOUT: 15
      TEST_RFC4704_DDNS_EXPIRY_TIMEOUT: 30
    depends_on:
      ddns-observer:
        condition: service_healthy
      kea-ddns:
        condition: service_healthy
