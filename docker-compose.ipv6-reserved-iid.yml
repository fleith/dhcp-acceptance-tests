  test-runner:
    environment:
      TEST_DHCPV6_RESERVED_POOL_ALLOWED: >-
        fd00:29::1,fd00:29:0:0:200:5eff:fdff:ffff,fd00:29:0:0:200:5eff:ff00:0,fd00:29:0:0:fdff:ffff:ffff:ff7f,fd00:29:0:0:fe00::
